<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#21214180"/>
      <stop offset="0" stop-color="#212141"/>
      <stop offset="1" stop-color="#090912"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.44" r="0.56">
      <stop offset="0" stop-color="#f0b840" stop-opacity="0.5"/>
      <stop offset="0.42" stop-color="#f0b840" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f0b840" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0.2" y1="0.05" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffe6a0"/>
      <stop offset="0.5" stop-color="#f0b840"/>
      <stop offset="1" stop-color="#e0912a"/>
    </linearGradient>
  </defs>

  <!-- deep-space rounded tile -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>

  <!-- drifting starfield (fades out at small sizes) -->
  <g fill="#ffffff">
    <circle cx="228" cy="256" r="4.5" opacity="0.55"/>
    <circle cx="806" cy="300" r="5.5" opacity="0.5"/>
    <circle cx="300" cy="806" r="4" opacity="0.42"/>
    <circle cx="792" cy="772" r="3.5" opacity="0.5"/>
    <circle cx="512" cy="158" r="3" opacity="0.38"/>
    <circle cx="168" cy="560" r="3" opacity="0.35"/>
  </g>

  <!-- the Siddran mark: a four-point drifting sparkle -->
  <path d="M512 188 Q580 444 836 512 Q580 580 512 836 Q444 580 188 512 Q444 444 512 188 Z" fill="url(#amber)"/>
  <path d="M512 300 Q548 476 724 512 Q548 548 512 724 Q476 548 300 512 Q476 476 512 300 Z" fill="#ffffff" opacity="0.16"/>

  <!-- hairline edge -->
  <rect x="3" y="3" width="1018" height="1018" rx="226" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="4"/>
</svg>
