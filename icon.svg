<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Siddran app icon. The rounded tile IS the bag: a zipper runs edge to edge with
       its pull hanging near the left, and the front pouch carries the star.
       Flat colour, no gradients — it has to survive 32px in a dock.
       Regenerate every platform icon with:  npx tauri icon icon.svg  -->
  <defs>
    <clipPath id="tile">
      <rect width="1024" height="1024" rx="228"/>
    </clipPath>
  </defs>

  <!-- muted gold tile: bright enough to stand out among dark dock icons, without glare -->
  <rect width="1024" height="1024" rx="228" fill="#d18f28"/>

  <g clip-path="url(#tile)">
    <!-- zipper seam, full width; clipped so it meets the rounded sides cleanly -->
    <path d="M0 356 Q512 516 1024 356" fill="none" stroke="#0d0b14" stroke-width="62"/>

    <!-- pull: ring sitting on the seam, tab dangling below -->
    <circle cx="150" cy="396" r="52" fill="none" stroke="#0d0b14" stroke-width="36"/>
    <rect x="124" y="440" width="52" height="116" rx="26" fill="#0d0b14"/>

    <!-- front pouch -->
    <path d="M314 558 H710 Q778 558 778 626 V790 Q778 858 710 858 H314 Q246 858 246 790 V626 Q246 558 314 558 Z"
          fill="#0d0b14"/>

    <!-- the star, cut out of the pouch -->
    <path d="M512 592 C523.6 669.72 550.28 696.4 628 708 C550.28 719.6 523.6 746.28 512 824
             C500.4 746.28 473.72 719.6 396 708 C473.72 696.4 500.4 669.72 512 592 Z"
          fill="#d18f28"/>
  </g>
</svg>
