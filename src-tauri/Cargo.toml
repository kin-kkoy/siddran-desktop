[package]
name = "siddran"
version = "0.1.0"
description = "Siddran — a local-first notes, tasks & planning desktop app"
authors = ["kin-kkoy"]
edition = "2021"
rust-version = "1.77"

# The Tauri desktop shell. The React app (../app) is the whole UI; this crate
# just hosts a WebKitGTK window and, later, the local-vault filesystem commands.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"   # native folder picker for choosing a Bag
tauri-plugin-opener = "2"   # hand a URL to the browser / a file to the file manager
tauri-plugin-notification = "2" # desktop notifications for deadline alarms
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2" # a second launch (opening a .md) reaches the running window
notify = "8"                # watch the Bag for writes from the CLI, an AI, a sync tool
base64 = "0.22"             # decode attachment bytes sent from the frontend

# Read the installed WebKitGTK's version at startup (see main.rs) — already in
# the tree through Tauri, so this adds no new code, only a direct name for it.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk-sys = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"   # optimise for a small binary — a stated goal for Siddran
strip = true
panic = "abort"
