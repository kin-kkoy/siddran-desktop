<!doctype html><meta charset="utf-8">
<title>Siddran — app icon options</title>
<!-- Candidate app icons (the dock / launcher icon), shown at real dock sizes.
     Pick one, then it gets written to icon.svg and `npx tauri icon icon.svg`
     regenerates every file in src-tauri/icons/. -->
<style>
  body{margin:0;background:#15151f;font:12px Inter,system-ui,sans-serif;color:#b8b3d0}
  .row{display:flex;align-items:center;gap:22px;padding:14px 20px;border-bottom:1px solid #262638}
  h1{font-size:15px;color:#e2ddf5;margin:0;padding:16px 20px 4px}
  .hint{padding:0 20px 14px;color:#635f80}
  .name{width:150px;color:#e2ddf5;font-weight:600;font-size:13px}
  .name small{display:block;color:#635f80;font-weight:400;font-size:11px;margin-top:2px}
  .sz{display:flex;flex-direction:column;align-items:center;gap:5px}
  .sz span{color:#635f80;font-size:10px}
</style>
<body>
<h1>App icon options</h1>
<div class="hint">Shown at the sizes they'll actually appear in your dock. Squint at the 32px column — that's the one that matters.</div>
<script>
const TILE_DARK = `<defs>
 <linearGradient id="bg%I%" x1=".15" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#212141"/><stop offset="1" stop-color="#090912"/></linearGradient>
 <linearGradient id="am%I%" x1=".2" y1=".05" x2=".8" y2="1"><stop offset="0" stop-color="#ffe6a0"/><stop offset=".5" stop-color="#f0b840"/><stop offset="1" stop-color="#e0912a"/></linearGradient>
</defs><rect width="1024" height="1024" rx="228" fill="url(#bg%I%)"/>`;

const TILE_AMBER = `<defs>
 <linearGradient id="bg%I%" x1=".15" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#ffc95c"/><stop offset="1" stop-color="#e0912a"/></linearGradient>
</defs><rect width="1024" height="1024" rx="228" fill="url(#bg%I%)"/>`;

const HANDLE = 'M400 392 C400 246 624 246 624 392';
const BODY   = 'M286 392 H738 L780 806 Q786 878 712 878 H312 Q238 878 244 806 Z';
const STAR   = (cx,cy,r)=>`M${cx} ${cy-r} C${cx+r*.1} ${cy-r*.33} ${cx+r*.33} ${cy-r*.1} ${cx+r} ${cy} C${cx+r*.33} ${cy+r*.1} ${cx+r*.1} ${cy+r*.33} ${cx} ${cy+r} C${cx-r*.1} ${cy+r*.33} ${cx-r*.33} ${cy+r*.1} ${cx-r} ${cy} C${cx-r*.33} ${cy-r*.1} ${cx-r*.1} ${cy-r*.33} ${cx} ${cy-r} Z`;

const OPTIONS = [
 {n:'A · Solid bag', d:'amber bag, dark tile', svg:i=>TILE_DARK.replaceAll('%I%',i)+
   `<path d="${HANDLE}" fill="none" stroke="url(#am${i})" stroke-width="54" stroke-linecap="round"/>
    <path d="${BODY}" fill="url(#am${i})"/>`},

 {n:'B · Inverted', d:'dark bag, amber tile', svg:i=>TILE_AMBER.replaceAll('%I%',i)+
   `<path d="${HANDLE}" fill="none" stroke="#1a1426" stroke-width="54" stroke-linecap="round"/>
    <path d="${BODY}" fill="#1a1426"/>`},

 {n:'C · Bag + sparkle', d:'nods to the splash', svg:i=>TILE_DARK.replaceAll('%I%',i)+
   `<path d="${HANDLE}" fill="none" stroke="url(#am${i})" stroke-width="54" stroke-linecap="round"/>
    <path d="${BODY}" fill="url(#am${i})"/>
    <path d="${STAR(792,286,104)}" fill="#ffe9b0"/>`},

 {n:'D · Outline', d:'stroked, lighter feel', svg:i=>TILE_DARK.replaceAll('%I%',i)+
   `<path d="${HANDLE}" fill="none" stroke="url(#am${i})" stroke-width="46" stroke-linecap="round"/>
    <path d="${BODY}" fill="none" stroke="url(#am${i})" stroke-width="52" stroke-linejoin="round"/>`},

 {n:'E · Sparkle in mouth', d:'bag opening, star rising', svg:i=>TILE_DARK.replaceAll('%I%',i)+
   `<path d="${HANDLE}" fill="none" stroke="url(#am${i})" stroke-width="54" stroke-linecap="round"/>
    <path d="${BODY}" fill="url(#am${i})"/>
    <path d="${STAR(512,392,132)}" fill="#15101c"/>
    <path d="${STAR(512,392,96)}" fill="#ffe9b0"/>`},
];

document.write(OPTIONS.map((o,i)=>`<div class="row">
  <div class="name">${o.n}<small>${o.d}</small></div>
  ${[128,64,32].map(s=>`<div class="sz"><svg width="${s}" height="${s}" viewBox="0 0 1024 1024">${o.svg(i)}</svg><span>${s}px</span></div>`).join('')}
</div>`).join(''));
</script>
