<!doctype html><meta charset="utf-8">
<title>Siddran — app icon tone</title>
<!-- Chosen shape: "F · Inverted bold" — amber tile, dark mark, edge-to-edge zipper,
     pouch + star. This sheet is only about the TILE COLOUR: the current amber reads
     too bright, so here it is stepped down through warmer / deeper tones.
     Pick one -> icon.svg -> `npx tauri icon icon.svg` regenerates src-tauri/icons/. -->
<style>
  body{margin:0;background:#15151f;font:12px Inter,system-ui,sans-serif;color:#b8b3d0}
  h1{font-size:15px;color:#e2ddf5;margin:0;padding:16px 20px 4px}
  .hint{padding:0 20px 14px;color:#635f80}
  .row{display:flex;align-items:center;gap:22px;padding:12px 20px;border-bottom:1px solid #262638}
  .name{width:150px;color:#e2ddf5;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
  .name small{display:block;color:#635f80;font-weight:400;font-size:11px;margin-top:2px}
  .sz{display:flex;flex-direction:column;align-items:center;gap:5px}
  .sz span{color:#635f80;font-size:10px}
</style>
<body>
<h1>App icon — tile tone</h1>
<div class="hint">Same shape (F), stepping the yellow down. Top row is the current brightness for comparison.</div>
<script>
const DEEP='#0d0b14';
const STAR=(cx,cy,r)=>`M${cx} ${cy-r} C${cx+r*.1} ${cy-r*.33} ${cx+r*.33} ${cy-r*.1} ${cx+r} ${cy} C${cx+r*.33} ${cy+r*.1} ${cx+r*.1} ${cy+r*.33} ${cx} ${cy+r} C${cx-r*.1} ${cy+r*.33} ${cx-r*.33} ${cy+r*.1} ${cx-r} ${cy} C${cx-r*.33} ${cy-r*.1} ${cx-r*.1} ${cy-r*.33} ${cx} ${cy-r} Z`;
const pouch=(x,y,w,h,r)=>`M${x+r} ${y} H${x+w-r} Q${x+w} ${y} ${x+w} ${y+r} V${y+h-r} Q${x+w} ${y+h} ${x+w-r} ${y+h} H${x+r} Q${x} ${y+h} ${x} ${y+h-r} V${y+r} Q${x} ${y} ${x+r} ${y} Z`;
const zipY=(y0,yc,t)=>y0*((1-t)**2+t**2)+2*yc*t*(1-t);

function icon(i, tileC){
  const y0=356, yc=516, px=150, py=zipY(y0,yc,px/1024);
  const [bx,by,bw,bh,br]=[246,558,532,300,68];
  return `<defs><clipPath id="k${i}"><rect width="1024" height="1024" rx="228"/></clipPath></defs>
  <rect width="1024" height="1024" rx="228" fill="${tileC}"/>
  <g clip-path="url(#k${i})">
    <path d="M0 ${y0} Q512 ${yc} 1024 ${y0}" fill="none" stroke="${DEEP}" stroke-width="62"/>
    <circle cx="${px}" cy="${py}" r="52" fill="none" stroke="${DEEP}" stroke-width="36"/>
    <rect x="${px-26}" y="${py+44}" width="52" height="116" rx="26" fill="${DEEP}"/>
    <path d="${pouch(bx,by,bw,bh,br)}" fill="${DEEP}"/>
    <path d="${STAR(bx+bw/2,by+bh/2,116)}" fill="${tileC}"/>
  </g>`;
}

const TONES = [
  ['#f0b840','current — too bright'],
  ['#e8ab34','a notch down'],
  ['#dd9c2c','deeper amber'],
  ['#d18f28','muted gold'],
  ['#c8842a','warm ochre'],
  ['#c0762a','orange lean'],
  ['#b56a26','burnt orange'],
];

document.write(TONES.map(([c,label],i)=>`<div class="row">
  <div class="name">${c}<small>${label}</small></div>
  ${[128,64,32].map(s=>`<div class="sz"><svg width="${s}" height="${s}" viewBox="0 0 1024 1024">${icon(i,c)}</svg><span>${s}px</span></div>`).join('')}
</div>`).join(''));
</script>
