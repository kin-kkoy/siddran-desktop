<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Siddran — Landscape (book) view prototype</title>
<style>
  :root {
    --bg-primary: #09090f;
    --bg-surface: #12121e;
    --bg-elevated: #1e1e2e;
    --bg-hover: #252538;
    --border-default: #252538;
    --border-strong: #333350;
    --text-primary: #e2ddf5;
    --text-secondary: #b8b3d0;
    --text-muted: #635f80;
    --accent-blue: #5a9cf0;
    --accent-warning: #d9a441;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg-primary); color: var(--text-primary);
    font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
    font-size: 16px; line-height: 1.75;
  }

  /* ── control bar ─────────────────────────────────────────────── */
  .bar {
    position: sticky; top: 0; z-index: 5;
    display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
    padding: 10px 18px; background: var(--bg-surface);
    border-bottom: 1px solid var(--border-default);
    font-size: 13px; color: var(--text-secondary);
  }
  .group { display: flex; align-items: center; gap: 8px; }
  .group.dim { opacity: .4; pointer-events: none; }
  .seg { display: flex; border: 1px solid var(--border-strong); border-radius: 6px; overflow: hidden; }
  .seg button {
    background: transparent; border: none; color: var(--text-muted);
    padding: 5px 11px; font: inherit; cursor: pointer; white-space: nowrap;
  }
  .seg button[aria-pressed="true"] { background: var(--bg-elevated); color: var(--text-primary); }
  input[type=range] { width: 110px; accent-color: var(--accent-blue); }
  .val { font-variant-numeric: tabular-nums; color: var(--text-muted); min-width: 44px; }
  .note {
    padding: 8px 18px; background: var(--bg-surface); color: var(--text-muted);
    font-size: 12px; border-bottom: 1px solid var(--border-default);
  }
  .note b { color: var(--text-secondary); font-weight: 600; }

  .stage { display: flex; justify-content: center; padding: 26px 16px 48px; }

  /* ── shared note typography ──────────────────────────────────── */
  .doc h1 { font-size: 1.7em; margin: 0 0 .4em; break-after: avoid; }
  .doc h2 { font-size: 1.3em; margin: 1.2em 0 .35em; break-after: avoid; }
  .doc p { margin: 0 0 .9em; }
  .doc ul { margin: 0 0 .9em; padding-left: 1.3em; }
  .doc table { border-collapse: collapse; margin: .6em 0; width: 100%; }
  .doc th, .doc td { border: 1px solid var(--border-default); padding: 5px 9px; font-size: .92em; }
  .doc th { background: var(--bg-elevated); }
  .doc blockquote {
    margin: 0 0 .9em; padding-left: 14px;
    border-left: 3px solid var(--border-strong); color: var(--text-secondary);
  }
  .doc code { background: var(--bg-elevated); border-radius: 4px; padding: 0 4px; font-size: .9em; }
  .doc mark { background: rgba(217,164,65,.25); color: inherit; border-radius: 2px; }
  .doc:focus { outline: none; }

  /* ── A. BOOK SPREAD (read, and "freeze" writing) ─────────────── */
  .viewport {
    position: relative; overflow: hidden;
    background: var(--bg-surface); border: 1px solid var(--border-strong);
    border-radius: 10px; padding: 34px 40px;
  }
  .viewport.scrolling { overflow-y: auto; }
  .pages { height: 100%; column-count: 2; column-gap: 64px; column-fill: auto; }
  /* Flow mode splits at ANY visual line. Browsers default to orphans/widows: 2, which
     refuses to leave one lonely line at a page bottom (or carry one to the next top)
     and shunts the WHOLE paragraph forward instead — which reads as "the paragraph
     jumped" and leaves white space. 1/1 lets a paragraph break exactly where it fills. */
  .pages:not(.keep-whole), .pages:not(.keep-whole) p, .pages:not(.keep-whole) li,
  .pages:not(.keep-whole) blockquote { orphans: 1; widows: 1; }
  /* While "frozen" the page clamp is lifted: text stops re-paginating mid-keystroke
     and simply grows downward, then re-settles into pages when you pause. */
  .pages.freeze { column-count: 1; height: auto; transform: none !important; }
  .pages.keep-whole p, .pages.keep-whole li, .pages.keep-whole blockquote,
  .pages.keep-whole table, .pages.keep-whole h1, .pages.keep-whole h2 { break-inside: avoid; }
  .spine {
    position: absolute; top: 26px; bottom: 26px; left: 50%; width: 1px;
    background: linear-gradient(to bottom, transparent, var(--border-default) 12%, var(--border-default) 88%, transparent);
    pointer-events: none;
  }
  .spine.hidden { display: none; }
  .nav { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .arrow {
    background: var(--bg-elevated); border: 1px solid var(--border-strong);
    color: var(--text-secondary); border-radius: 8px; padding: 7px 14px;
    font: inherit; font-size: 13px; cursor: pointer;
  }
  .arrow:hover:not(:disabled) { background: var(--bg-hover); color: var(--text-primary); border-color: var(--accent-blue); }
  .arrow:disabled { opacity: .35; cursor: default; }
  .pageno { color: var(--text-muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .frozen-badge {
    position: absolute; top: 8px; right: 12px; font-size: 11px;
    color: var(--accent-warning); opacity: 0; transition: opacity .15s;
  }
  .frozen-badge.on { opacity: 1; }

  /* ── B. VERTICAL PAGES (Word-style writing) ──────────────────── */
  .vwrap { position: relative; }
  .vpages {
    position: relative; z-index: 1;
    background: var(--bg-surface); border: 1px solid var(--border-strong);
    border-radius: 10px; padding: 34px 40px;
  }
  .guides { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .guide { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border-strong); }
  .guide span {
    position: absolute; right: 10px; top: 4px;
    font-size: 10.5px; color: var(--text-muted); background: var(--bg-surface); padding: 0 5px;
  }

  /* ── C. PLAIN SCROLL ─────────────────────────────────────────── */
  .scrollWrap {
    background: var(--bg-surface); border: 1px solid var(--border-strong);
    border-radius: 10px; padding: 34px 40px;
  }
</style>
</head>
<body>

<div class="bar">
  <div class="group">
    <span>Mode</span>
    <div class="seg" id="editSeg">
      <button data-edit="read" aria-pressed="true">Read</button>
      <button data-edit="write" aria-pressed="false">Write</button>
    </div>
  </div>

  <div class="group" id="writeGroup">
    <span>Writing as</span>
    <div class="seg" id="writeSeg">
      <button data-w="bookflow" aria-pressed="true">Book · flow</button>
      <button data-w="vertical" aria-pressed="false">Vertical</button>
      <button data-w="freeze" aria-pressed="false">Book · freeze</button>
      <button data-w="scroll" aria-pressed="false">Scroll</button>
    </div>
  </div>

  <div class="group" id="breakGroup">
    <span>Breaks</span>
    <div class="seg" id="breakSeg">
      <button data-brk="flow" aria-pressed="true">Continue</button>
      <button data-brk="keep" aria-pressed="false">Keep whole</button>
    </div>
  </div>

  <div class="group" id="turnGroup">
    <span>Turn</span>
    <div class="seg" id="turnSeg">
      <button data-turn="fade" aria-pressed="true">Fade</button>
      <button data-turn="instant" aria-pressed="false">Instant</button>
    </div>
  </div>

  <div class="group">
    <span>W</span>
    <input type="range" id="wRange" min="600" max="1500" step="20" value="1000" />
    <span class="val" id="wVal">1000</span>
  </div>
  <div class="group">
    <span>H</span>
    <input type="range" id="hRange" min="360" max="900" step="20" value="620" />
    <span class="val" id="hVal">620</span>
  </div>
</div>

<div class="note" id="explain"></div>

<div class="stage">
  <!-- A. book spread (read mode, and "book + freeze" writing) -->
  <div id="bookOuter">
    <div class="viewport" id="viewport">
      <div class="pages doc" id="pages"></div>
      <div class="spine" id="spine"></div>
      <span class="frozen-badge" id="frozen">frozen while typing…</span>
    </div>
    <div class="nav">
      <button class="arrow" id="prev">‹ Previous</button>
      <span class="pageno" id="pageno">1 / 1</span>
      <button class="arrow" id="next">Next ›</button>
    </div>
  </div>

  <!-- B. vertical pages -->
  <div class="vwrap" id="vertOuter" hidden>
    <div class="vpages doc" id="vpages"></div>
    <div class="guides" id="guides"></div>
  </div>

  <!-- C. plain scroll -->
  <div class="scrollWrap doc" id="scrollOuter" hidden></div>
</div>

<script>
const NOTE = `
<h1>On Keeping a Second Brain</h1>
<p>The point of a note is not to <em>store</em> a thought but to make it findable
later, when a future version of you needs it and has forgotten it ever existed.
That reframing changes what you write down and how.</p>
<p>Most systems fail not because capture is hard but because retrieval is. A note
you cannot find is indistinguishable from a note you never wrote.</p>

<h2>The capture problem</h2>
<p>Capture should cost almost nothing. If writing something down takes more than a
few seconds of friction, the thought evaporates and you are left with the vague
memory of having had an idea, which is worse than nothing because it nags.</p>
<blockquote>A thought you half-remember is a debt you keep paying interest on.</blockquote>
<p>This is why the inbox pattern works: one place, no decisions, sort later. The
sorting is real work, but it is work you can batch, and batched work gets done.</p>
<ul>
  <li>Capture without categorising.</li>
  <li>Review on a cadence you actually keep, not the one you admire.</li>
  <li>Prune ruthlessly — an archive nobody reads is a graveyard.</li>
</ul>

<h2>Structure emerges, it isn't imposed</h2>
<p>Every folder hierarchy designed in advance is a prediction about what you will
think next year. Those predictions are usually wrong. Links, tags, and search let
structure grow out of the material instead of being poured over it like concrete.</p>
<p>Start flat. Add structure only where the pain is real — where you have looked
for something three times and failed three times. That third failure is the
signal, and it is worth waiting for.</p>

<h2>A quick comparison</h2>
<table>
  <thead><tr><th>Approach</th><th>Strength</th><th>Weakness</th></tr></thead>
  <tbody>
    <tr><td>Folders</td><td>Familiar</td><td>One place per note</td></tr>
    <tr><td>Tags</td><td>Many facets</td><td>Drifts without discipline</td></tr>
    <tr><td>Links</td><td>Context travels</td><td>Needs a habit</td></tr>
  </tbody>
</table>

<h2>On rereading</h2>
<p>The highest-value habit is rereading old notes at random. It is also the one
nobody does, because it produces no visible output and feels like procrastination.
It isn't — it's the step where isolated facts turn into <mark>connections</mark>,
and connections are the entire point of the exercise.</p>
<p>Set a small, boring cadence. Five notes a week. Delete what is dead, rewrite
what is unclear, link what is related. Most will be forgettable; the occasional
one will rearrange how you think about a problem you're stuck on right now.</p>
<p>The compounding is slow and then sudden, the way it is with anything that
depends on a corpus reaching critical mass. Two hundred notes is a drawer. Two
thousand is a collaborator.</p>

<h2>Practical defaults</h2>
<p>Write the note as if explaining to a competent stranger — because in six months
that is exactly who you'll be. Use full sentences in summaries; shorthand rots.
Put the conclusion first, the reasoning after, and the raw material last, so that
skimming still pays.</p>
<p>Name things by what they are about, not by when you made them. Dates are
metadata your tool already knows; a title is the only handle your memory gets.</p>
`;

const $ = (id) => document.getElementById(id);
const viewport = $('viewport'), pages = $('pages'), bookOuter = $('bookOuter');
const vertOuter = $('vertOuter'), vpages = $('vpages'), guides = $('guides');
const scrollOuter = $('scrollOuter');
const prevBtn = $('prev'), nextBtn = $('next'), pageno = $('pageno');

let docHTML = NOTE;      // single source of truth, shared across the three views
let editing = false;     // read | write
let writeStyle = 'bookflow';
let turnStyle = 'fade';
let spread = 0;
let frozen = false, idleTimer = null;

// ── which view is showing ──────────────────────────────────────────
function currentView() {
  if (!editing) return 'book';
  return (writeStyle === 'freeze' || writeStyle === 'bookflow') ? 'book' : writeStyle;
}
function activeDoc() {
  const v = currentView();
  return v === 'book' ? pages : v === 'vertical' ? vpages : scrollOuter;
}

const EXPLAIN = {
  read: '<b>Read.</b> Book spread, two pages at a time. Try <b>Breaks</b> to switch between cutting mid-sentence and never splitting a block, and <b>Turn</b> to compare page-turn feels.',
  bookflow: '<b>Book · flow.</b> Type away — the text simply flows on, exactly like the vertical view, just displayed as two pages. Nothing recomputes or rebalances: no re-measuring per keystroke, no page-turn animation, and the spread only moves if your caret would leave the screen. <i>The one motion left is unavoidable: with two pages side by side, adding a line means the last line of the left page hops to the top of the right page. That hop is the thing to judge.</i>',
  vertical: '<b>Vertical.</b> Same page size, stacked top-to-bottom like Word. Typing pushes text <b>down</b> — the same flow as Book · flow, but you never see the hand-off between pages. Dashed lines mark the breaks. <i>Prototype note: guides sit at exact page heights so a line can straddle one; a real build would break cleanly.</i>',
  freeze: '<b>Book · freeze.</b> Pagination suspends while you type — text grows downward, nothing reflows — then re-settles on a ~0.8s pause and jumps to your caret\'s page. Judge whether that <b>snap</b> beats the small hop in Book · flow.',
  scroll: '<b>Scroll.</b> Landscape becomes a reading-only presentation; writing stays today\'s continuous editor. Zero churn — the baseline.',
};

function setLayout(preserve = true) {
  if (preserve) { const a = activeDoc(); if (a && a.isConnected && !a.hidden) docHTML = a.innerHTML; }
  const v = currentView();

  bookOuter.hidden = v !== 'book';
  vertOuter.hidden = v !== 'vertical';
  scrollOuter.hidden = v !== 'scroll';

  // controls that only make sense for the book spread
  $('writeGroup').classList.toggle('dim', !editing);
  $('breakGroup').classList.toggle('dim', v !== 'book');
  $('turnGroup').classList.toggle('dim', v !== 'book' || (editing && writeStyle === 'freeze'));
  $('explain').innerHTML = editing ? EXPLAIN[writeStyle] : EXPLAIN.read;

  const target = activeDoc();
  target.innerHTML = docHTML;
  target.contentEditable = editing ? 'true' : 'false';

  unfreeze(false);
  applySize();
  if (v === 'vertical') drawGuides();
  if (editing) target.focus();
}

// ── book spread paging ─────────────────────────────────────────────
function metrics() {
  const gap = parseFloat(getComputedStyle(pages).columnGap) || 0;
  const w = pages.clientWidth;
  const step = w + gap;
  const total = Math.max(1, Math.round((pages.scrollWidth + gap) / step));
  return { gap, step, total };
}

let placedAt = null; // last transform actually applied, so typing never re-lays-out

function render(animate = true) {
  if (currentView() !== 'book' || frozen) return;
  const { step, total } = metrics();
  spread = Math.max(0, Math.min(spread, total - 1));
  const offset = -spread * step;
  const place = () => { pages.style.transform = `translateX(${offset}px)`; placedAt = offset; };
  // Nothing moved: leave the DOM alone entirely (no transition, no restyle).
  if (offset === placedAt && animate) { updateNav(total); return; }

  if (!animate || turnStyle === 'instant') {
    pages.style.transition = 'none'; pages.style.opacity = '1'; place();
    requestAnimationFrame(() => { pages.style.transition = ''; });
  } else if (turnStyle === 'fade') {
    pages.style.transition = 'opacity .11s linear';
    pages.style.opacity = '0';
    setTimeout(() => {
      pages.style.transition = 'none'; place();
      requestAnimationFrame(() => {
        pages.style.transition = 'opacity .15s linear'; pages.style.opacity = '1';
      });
    }, 110);
  } else {
    pages.style.transition = 'transform .28s cubic-bezier(.22,.61,.36,1)';
    pages.style.opacity = '1'; place();
  }

  updateNav(total);
}

function updateNav(total) {
  pageno.textContent = `${spread * 2 + 1}–${spread * 2 + 2} of ~${total * 2}`;
  prevBtn.disabled = spread === 0;
  nextBtn.disabled = spread >= total - 1;
}
const go = (d) => { spread += d; render(); };
prevBtn.onclick = () => go(-1);
nextBtn.onclick = () => go(1);

// ── caret tracking (book spread) ───────────────────────────────────
function caretSpread() {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return null;
  const r = sel.getRangeAt(0).cloneRange(); r.collapse(true);
  let rect = r.getBoundingClientRect();
  if (!rect || (!rect.width && !rect.height)) {
    const probe = document.createElement('span');
    probe.textContent = '​';
    r.insertNode(probe); rect = probe.getBoundingClientRect(); probe.remove();
  }
  const { step } = metrics();
  const x = rect.left - viewport.getBoundingClientRect().left + spread * step;
  return Math.floor(x / step);
}
// Only acts when the caret has genuinely left the visible spread — typing inside the
// two pages on screen never moves anything. The jump is instant (never animated), so
// it reads as "the page turned because I wrote past the bottom", not as a transition.
function followCaret() {
  if (currentView() !== 'book' || !editing || frozen) return;
  const s = caretSpread();
  if (s != null && s >= 0 && s !== spread) { spread = s; render(false); }
}

// ── "freeze while typing" ──────────────────────────────────────────
function freeze() {
  if (frozen) return;
  frozen = true;
  pages.classList.add('freeze');
  viewport.classList.add('scrolling');
  $('spine').classList.add('hidden');
  $('frozen').classList.add('on');
}
function unfreeze(settle = true) {
  if (!frozen) { $('frozen').classList.remove('on'); return; }
  frozen = false;
  pages.classList.remove('freeze');
  viewport.classList.remove('scrolling');
  viewport.scrollTop = 0;
  $('spine').classList.remove('hidden');
  $('frozen').classList.remove('on');
  if (settle) { render(false); followCaret(); }
}

// ── vertical page guides ───────────────────────────────────────────
function drawGuides() {
  const h = +$('hRange').value;
  guides.innerHTML = '';
  const total = Math.max(1, Math.ceil(vpages.scrollHeight / h));
  for (let i = 1; i < total; i++) {
    const d = document.createElement('div');
    d.className = 'guide';
    d.style.top = (i * h) + 'px';
    d.innerHTML = `<span>page ${i + 1}</span>`;
    guides.appendChild(d);
  }
}

// ── editing hooks ──────────────────────────────────────────────────
let countTimer = null;

function onInput() {
  const v = currentView();
  docHTML = activeDoc().innerHTML;
  if (v === 'vertical') { drawGuides(); return; }        // push-down: nothing to re-page
  if (v === 'scroll') return;
  if (writeStyle === 'freeze') {                          // suspend, settle on pause
    freeze();
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => unfreeze(true), 800);
    return;
  }
  // Book · flow — the text just flows on. Deliberately NO re-measure, no transform
  // rewrite, no animation per keystroke; the browser's column flow does the work.
  // We only move the spread if the caret would otherwise be off-screen, and we
  // refresh the page counter lazily so it can't cause churn while typing.
  followCaret();
  clearTimeout(countTimer);
  countTimer = setTimeout(() => updateNav(metrics().total), 250);
}
[pages, vpages, scrollOuter].forEach((el) => {
  el.addEventListener('input', onInput);
  el.addEventListener('keyup', (e) => { if (e.key.startsWith('Arrow')) followCaret(); });
  el.addEventListener('click', () => setTimeout(followCaret, 0));
});

// ── controls ───────────────────────────────────────────────────────
function wire(id, attr, fn) {
  $(id).onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    [...e.currentTarget.children].forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    fn(b.dataset[attr]);
  };
}
wire('editSeg', 'edit', (v) => { editing = v === 'write'; setLayout(); });
wire('writeSeg', 'w', (v) => { writeStyle = v; setLayout(); });
wire('breakSeg', 'brk', (v) => { pages.classList.toggle('keep-whole', v === 'keep'); render(false); });
wire('turnSeg', 'turn', (v) => { turnStyle = v; });

function applySize() {
  const w = +$('wRange').value, h = +$('hRange').value;
  $('wVal').textContent = w; $('hVal').textContent = h;
  viewport.style.width = w + 'px';
  viewport.style.height = h + 'px';
  // A vertical "page" is one page of the spread — half the width, same height.
  const pageW = Math.round((w - 64) / 2) + 80;
  vpages.style.width = pageW + 'px';
  vpages.style.minHeight = h + 'px';
  scrollOuter.style.width = w + 'px';
  if (currentView() === 'book') render(false);
  if (currentView() === 'vertical') drawGuides();
}
$('wRange').oninput = applySize;
$('hRange').oninput = applySize;

document.addEventListener('keydown', (e) => {
  if (currentView() !== 'book' || frozen) return;
  const turnKeys = editing ? ['PageDown', 'PageUp'] : ['PageDown', 'PageUp', 'ArrowRight', 'ArrowLeft'];
  if (!turnKeys.includes(e.key)) return;
  e.preventDefault();
  go(e.key === 'PageDown' || e.key === 'ArrowRight' ? 1 : -1);
});

window.addEventListener('resize', () => { if (currentView() === 'book') render(false); else drawGuides(); });
setLayout(false);
</script>
</body>
</html>
