<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codebase Map</title>
<style>
  :root{
    --paper:#cdc7a2;
    --paper-2:#c6bf97;
    --ink:#15150f;
    --ink-soft:#4a4835;
    --ink-faint:#8b8768;
    --line:#15150f;
    --hot:#15150f;
    --face-top:#d6d0ad;
    --face-l:#bdb68c;
    --face-r:#aca578;
    --ext:#c0b98f;
    --mono:"DM Mono","SF Mono",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--mono);font-size:12px;line-height:1.5;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  /* ── top bar ─────────────────────────────────────────── */
  #top{
    display:flex;align-items:stretch;border-bottom:1px solid var(--line);
    height:44px;flex:0 0 auto;
  }
  .stat{
    padding:3px 14px;border-right:1px solid var(--line);
    display:flex;flex-direction:column;justify-content:center;min-width:0;
  }
  .stat:last-child{border-right:none}
  .stat .k{font-size:8.5px;letter-spacing:.13em;color:var(--ink-faint);text-transform:uppercase;white-space:nowrap}
  .stat .v{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat.repo .v{font-size:14px}
  #topspacer{flex:1;border-right:1px solid var(--line)}
  #topbtns{display:flex;align-items:center;gap:6px;padding:0 10px}
  button.btn{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
    background:transparent;color:var(--ink);border:1px solid var(--line);
    padding:5px 9px;cursor:pointer;
  }
  button.btn:hover{background:var(--ink);color:var(--paper)}
  button.btn[disabled]{opacity:.35;cursor:default}
  button.btn[disabled]:hover{background:transparent;color:var(--ink)}
  /* ── layout ──────────────────────────────────────────── */
  #main{display:flex;height:calc(100% - 44px)}
  #rail{
    flex:0 0 236px;border-right:1px solid var(--line);overflow-y:auto;
    padding:8px 0 40px;
  }
  #panel{
    flex:0 0 400px;border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;
  }
  #stage{flex:1;position:relative;min-width:0;overflow:hidden}
  /* ── left rail ───────────────────────────────────────── */
  .grp{
    font-size:8.5px;letter-spacing:.16em;color:var(--ink-faint);
    text-transform:uppercase;padding:14px 12px 5px;
  }
  .row{
    display:flex;align-items:flex-start;gap:8px;margin:0 8px 4px;padding:6px 8px;
    border:1px solid var(--line);cursor:pointer;background:transparent;width:calc(100% - 16px);
    text-align:left;font-family:var(--mono);font-size:10.5px;color:var(--ink);line-height:1.35;
  }
  .row.child{margin-left:24px;width:calc(100% - 32px);border-color:var(--ink-soft);opacity:.92}
  .row:hover{background:var(--paper-2)}
  .row.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .row.on .rc,.row.on .rn{color:inherit}
  .row .rc{flex:0 0 16px;color:var(--ink-faint);font-size:9.5px;padding-top:1px}
  .row .rn{flex:1;letter-spacing:.05em;text-transform:uppercase;min-width:0}
  .row .rx{flex:0 0 auto;font-size:9px;color:var(--ink-faint);padding-top:1px}
  .row.on .rx{color:var(--paper)}
  .dot{display:inline-block;width:5px;height:5px;border:1px solid currentColor;margin-left:5px;vertical-align:middle}
  .dot.fill{background:currentColor}
  /* ── stage ───────────────────────────────────────────── */
  #svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #svg.drag{cursor:grabbing}
  #zoom{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:5px}
  #zoom button{width:24px;height:24px;font-size:13px;line-height:1;padding:0}
  #crumb{
    position:absolute;top:10px;left:12px;font-size:9.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-soft);
  }
  #hint{
    position:absolute;left:0;right:0;bottom:0;padding:7px 12px;
    font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);
    border-top:1px solid var(--line);background:var(--paper);
  }
  .blk{cursor:pointer}
  .blk .top{fill:var(--face-top)}
  .blk .fl{fill:var(--face-l)}
  .blk .fr{fill:var(--face-r)}
  .blk polygon,.blk path.edge{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
  .blk text{fill:var(--ink);font-family:var(--mono);font-size:11px;letter-spacing:.06em;pointer-events:none}
  .blk .lay{stroke:var(--line);stroke-width:.5;opacity:.45;vector-effect:non-scaling-stroke}
  .blk.ext polygon{stroke-dasharray:4 3}
  .blk.ext .top{fill:var(--ext)}
  .blk.hot .top{fill:var(--ink)}
  .blk.hot text{fill:var(--paper)}
  .blk.hot polygon{stroke-width:1.8}
  .blk.sel .top{fill:var(--ink)}
  .blk.sel text{fill:var(--paper)}
  .blk.sel polygon{stroke-width:1.8}
  .blk.dim{opacity:.34}
  .grid{stroke:var(--ink);stroke-width:.5;opacity:.13;vector-effect:non-scaling-stroke}
  .wire{stroke:var(--ink);fill:none;stroke-width:1;vector-effect:non-scaling-stroke;opacity:.75}
  .wire.soft{stroke-dasharray:3 4;opacity:.45}
  .wire.lit{stroke-width:2;opacity:1}
  .joint{fill:var(--ink);opacity:.75}
  /* ── right panel ─────────────────────────────────────── */
  #tabs{display:flex;flex:0 0 auto;border-bottom:1px solid var(--line)}
  #tabs button{
    flex:1;padding:11px 6px;background:transparent;border:none;border-right:1px solid var(--line);
    font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);cursor:pointer;
  }
  #tabs button:last-child{border-right:none}
  #tabs button.on{background:var(--ink);color:var(--paper)}
  #body{flex:1;overflow-y:auto;padding:16px 18px 60px}
  #body h1{font-size:19px;font-weight:400;letter-spacing:.01em;margin:0 0 4px;line-height:1.25}
  #body .kicker{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px}
  #body .sub{font-size:11px;color:var(--ink-soft);margin:0 0 18px;line-height:1.45}
  #body h2{
    font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);
    font-weight:400;margin:22px 0 7px;border-bottom:1px solid var(--ink-faint);padding-bottom:5px;
  }
  #body p{margin:0 0 11px;font-size:12px;line-height:1.62}
  #body ul{margin:0 0 11px;padding-left:0;list-style:none}
  #body li{font-size:11.5px;line-height:1.55;margin-bottom:5px;padding-left:14px;position:relative}
  #body li:before{content:"·";position:absolute;left:4px;color:var(--ink-faint)}
  #body code,#body .f{
    background:var(--paper-2);padding:1px 4px;font-family:var(--mono);font-size:10.5px;
    border:1px solid rgba(21,21,15,.14);white-space:nowrap;
  }
  #body mark{background:var(--ink);color:var(--paper);padding:1px 4px}
  #body .files li{padding-left:0}
  #body .files li:before{content:none}
  #body .files .f{display:inline-block;margin:0 4px 4px 0;white-space:normal;word-break:break-all}
  #body .tag{
    display:inline-block;border:1px solid var(--line);padding:2px 6px;margin:0 4px 5px 0;
    font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  }
  #body .tag.solid{background:var(--ink);color:var(--paper)}
  #body .meta{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 16px}
  #body .meta div{font-size:10px}
  #body .meta .k{font-size:8.5px;letter-spacing:.13em;color:var(--ink-faint);text-transform:uppercase}
  #body .link{
    display:block;width:100%;text-align:left;margin:4px 0 0;padding:7px 9px;
    border:1px solid var(--line);background:transparent;cursor:pointer;
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);
  }
  #body .link:hover{background:var(--ink);color:var(--paper)}
  .flow{border:1px solid var(--ink-faint);padding:9px 11px;margin:0 0 12px;font-size:10.5px;line-height:1.7}
  .flow b{font-weight:400;background:var(--ink);color:var(--paper);padding:1px 4px}
  @media (max-width:1180px){
    #rail{flex-basis:190px}
    #panel{flex-basis:320px}
  }
</style>
</head>
<body>
<div id="top">
  <div class="stat repo"><span class="k">Repository</span><span class="v" id="s-repo"></span></div>
  <div id="stats" style="display:flex"></div>
  <div id="topspacer"></div>
  <div id="topbtns">
    <button class="btn" id="b-back" disabled>&#8592; come back out</button>
    <button class="btn" id="b-fit">reset view</button>
  </div>
</div>
<div id="main">
  <aside id="rail"></aside>
  <section id="stage">
    <svg id="svg"></svg>
    <div id="crumb"></div>
    <div id="zoom">
      <button class="btn" id="b-in">+</button>
      <button class="btn" id="b-out">&#8722;</button>
    </div>
    <div id="hint">&#8594; click a block to pin it &#183; hover to read &#183; double-click to go inside &#183; drag to pan &#183; scroll to zoom</div>
  </section>
  <aside id="panel">
    <div id="tabs">
      <button class="on" data-tab="what">What it does</button>
      <button data-tab="how">How it's built</button>
    </div>
    <div id="body"></div>
  </aside>
</div>
<script>
/* ══════════════════════════════════════════════════════════════════
   SIDDRAN DESKTOP — the local-first distribution (Tauri shell + the
   Cinder frontend, forked). Content only; renderer lives below.
   ══════════════════════════════════════════════════════════════════ */
const MAP = {
  title: "Siddran Desktop Codebase Map",
  repo: "siddran-desktop · tauri + local vault",
  stats: [
    { k: "Source files", v: "204 js/jsx · 63 css · 1 rs" },
    { k: "Lines", v: "≈33,100 + 112 rust" },
    { k: "Shell", v: "Tauri 2 · WebKitGTK" },
    { k: "Storage", v: "files on disk — a Bag" },
    { k: "Server", v: "none (sync worker idle)" },
    { k: "Status", v: "active development" },
  ],

  overview: {
    kicker: "Siddran · desktop",
    title: "The Local-First Distribution",
    sub: "the same app, running on a folder of markdown files instead of a server",
    what: [
      ["p", "Siddran Desktop is Cinder forked and re-grounded. The React app is nearly the same code — the same editor, the same calendar, the same sandbox — but everything below <code>authFetch</code> was replaced. There is <mark>no server, no account, and no login</mark>. You open a <b>Bag</b>, which is just a folder you choose, and the app runs on the files inside it."],
      ["p", "A Bag on disk looks like this, and it is meant to be readable without the app:"],
      ["flow", "MyBag/<br>&nbsp;&nbsp;notes/&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<b>.md files</b>, folders = notebooks, <b>.comments.json</b> sidecars<br>&nbsp;&nbsp;tasks.siddran&nbsp;&nbsp;&nbsp;&nbsp;tasks · dailies · completions · bundles<br>&nbsp;&nbsp;calendar.siddran&nbsp;events · schedules<br>&nbsp;&nbsp;settings.siddran<br>&nbsp;&nbsp;sandboxes/&nbsp;&nbsp;&nbsp;one JSON per board<br>&nbsp;&nbsp;attachments/&nbsp;&nbsp;pasted images, per note"],
      ["h", "The trick that made it possible"],
      ["p", "The web build already had a guest demo mode that served the whole app from an in-memory mock. That proved the app only ever talks to <i>one function</i>. The desktop build reuses the identical seam: <code>authFetch</code> checks whether a Bag is open and routes to <mark>localStore</mark> instead of the network. Every hook, page and component above it is unchanged and does not know the difference."],
      ["flow", "<b>App.jsx</b> → <b>authFetch</b> → <b>localStore</b> (REST-shaped, in memory) → debounced flush → <b>files on disk</b> → <b>Rust</b>"],
      ["h", "How to read this map"],
      ["p", "Height means weight. Blocks marked <mark>DESKTOP ONLY</mark> do not exist in the Cinder web build — that is the whole of the fork. Blocks marked <mark>NOT DEPLOYED</mark> are written and tested but not switched on."],
      ["p", "Hover any block for a description; the <mark>How it is built</mark> tab gives the implementation and files. Double-click a block with an inside (E, V, Q, C, B) to open it."],
      ["h", "Adding a feature — the usual path"],
      ["ul", [
        "New <b>data</b> → a handler in <code>desktop/localStore.js</code> (the REST shim), a dirty flag, a write in the flush, and hydration on open. Then the method in the matching hook.",
        "New <b>file on disk</b> → decide the format first: markdown if a human should read it, <code>.siddran</code> JSON otherwise. Add it to <code>hydrate()</code> and <code>flushNow()</code> together, or it silently will not persist.",
        "New <b>OS capability</b> (dialogs, paths, processes) → a <code>#[tauri::command]</code> in <code>src-tauri/src/main.rs</code>, then an adapter method in <code>desktop/fs/tauriFs.js</code>.",
        "New <b>editor syntax</b> → still the four-part change: Lezer node, live-preview case, theme class, remark plugin.",
      ]],
    ],
    how: [
      ["h", "Stack"],
      ["tags", ["Tauri 2 (Rust)", "WebKitGTK", "React 19", "Vite", "CodeMirror 6", "Konva", "remark / rehype", "Vitest", "AppImage + .deb"]],
      ["p", "Two npm projects: the root drives the Tauri CLI, <code>app/</code> is the frontend. <code>npm run tauri:dev</code> starts Vite and points the window at it; <code>npm run tauri:build</code> produces an AppImage and a .deb."],
      ["h", "Why Tauri, not Electron"],
      ["p", "Small binary and low memory — the window is the OS WebView rather than a bundled Chromium. The cost is WebKitGTK quirks on Linux, and several of them are pinned in code: mouse buttons 4 and 5 are wired to history navigation by hand, and empty <code>&lt;input type=time&gt;</code> fields need an overlay because WebKit paints a phantom time in them."],
      ["h", "Persistence model"],
      ["p", "The whole Bag is hydrated into memory on open. All reads are synchronous against that model; all writes mark a dirty flag and schedule a debounced flush 1.5&nbsp;s later. Notes reconcile against disk — files are written, moved when retitled, and orphans pruned — while tasks, calendar and settings are rewritten wholesale in a stable id order so the JSON diffs cleanly."],
      ["h", "Identity"],
      ["p", "Ids moved from server sequences to <code>crypto.randomUUID()</code> in July 2026 so two devices can create rows independently. Legacy numeric ids still parse; <code>parseId</code> coerces digit-only strings back to numbers so both kinds keep matching."],
      ["h", "Auth code still present"],
      ["p", "The JWT bootstrap and refresh loop survive in App.jsx, unused. They are dead weight in this build — <code>unlocked</code> is driven by whether a Bag is open, not by <code>isAuthed</code>."],
    ],
  },

  groups: [
    { title: "The shell", ids: ["A", "L", "Y", "I"] },
    { title: "The vault", ids: ["W", "D", "V", "J"] },
    { title: "Sync — built, not deployed", ids: ["Q", "O"] },
    { title: "The data spine", ids: ["F", "N", "T", "K", "S", "Z"] },
    { title: "The surfaces", ids: ["H", "P", "E", "R", "X", "C", "B"] },
    { title: "Extras", ids: ["M", "G"] },
  ],

  nodes: {
    /* ── shell ─────────────────────────────────────────────── */
    A: {
      name: "App shell & router", kind: "root component", count: "1041",
      path: "app/src/App.jsx", size: "1,041 lines — the largest file",
      gx: 0, gy: 0, w: 3, d: 3, h: 6, layers: 5,
      what: [
        ["p", "The one file that wires the whole application. It owns Bag state, builds <code>authFetch</code>, calls every data hook, and threads the results into the pages as props."],
        ["p", "What replaced login: <code>unlocked</code> is simply <i>is a Bag open</i>. No Bag → the BagPicker renders instead of the app. Opening one hydrates <code>localStore</code> <b>before</b> unlocking, so the data hooks fetch against a loaded store. Switching Bags flushes the old one, unmounts the shell for a frame and resets the URL, so nothing from the previous vault leaks in."],
        ["p", "It also hosts the two transactional calendar modes — <b>Plan mode</b> and the <b>Schedule Designer</b> — which have to sit above the shared stores."],
      ],
      add: [
        ["ul", [
          "A new page: import it, add a <code>&lt;Route&gt;</code>, thread props from the hooks already called here.",
          "A new global shortcut: the <code>keydown</code> effect near the calendar peek.",
          "A new provider: add to the sandwich at the bottom — Settings → Api → SandboxView → NoteSplit → PdfView → NoteTabs.",
          "Anything that must happen when a Bag opens or closes: <code>openBag</code> / <code>closeBag</code> / <code>switchBag</code>.",
          "Keep data logic out of here. It belongs in a hook or in localStore.",
        ]],
      ],
      how: [
        ["p", "A single component with roughly forty <code>useState</code>s. Plan mode and the Designer are shadow copies of the real lists plus an <code>eff*</code> layer choosing what the calendar sees:"],
        ["flow", "designer plot → plan session (staged) → <b>real store</b>"],
        ["p", "Boot order matters: splash screen (once per session, returned early so effects run underneath) → auto-reopen the last Bag → BagPicker if that fails → the shell. The auth bootstrap still runs but decides nothing."],
      ],
      files: ["app/src/App.jsx", "app/src/main.jsx", "app/src/index.css"],
    },
    L: {
      name: "Sidebar, tabs & panes", kind: "layout", count: "10",
      path: "app/src/components/Layout/ + Notes/NoteTabBar", size: "9 components",
      gx: 4, gy: 0, w: 2, d: 2, h: 3,
      what: [
        ["p", "The app chrome, noticeably richer than the web build. The sidebar header shows the open Bag's name, the profile at the top is a <b>Bag switcher</b> (a scrollable list of your vaults, social-profile style), and the footer carries the menu."],
        ["ul", [
          "<b>NoteTabBar</b> — Obsidian-style curved tabs across the content area <span class='tag'>desktop only</span>",
          "<b>SidebarOpenNotes</b> — the open-notes list <span class='tag'>desktop only</span>",
          "<b>ResizablePanes</b> / <b>ExpandSidebarButton</b> — the collapse fully hides the sidebar, and a contextual show button appears in whatever surface you are on",
          "<b>StarCanvas</b> — the star field (switched off on the note page here)",
        ]],
      ],
      add: [["p", "Nav destinations in <code>Sidebar.jsx</code>; tab behaviour in <code>NoteTabsContext</code> + <code>NoteTabBar</code>. The shared <code>--header-height</code> token keeps the sidebar brand and the tab bar aligned — change it in <code>index.css</code>, not per component."]],
      how: [["p", "The sidebar stays mounted and slides off-canvas by transform; remounting re-rendered the notes list and caused the collapse lag. The reserved gap next to it snaps instantly rather than animating width, because animating width reflowed CodeMirror every frame."]],
      files: ["app/src/components/Layout/Sidebar/Sidebar.jsx", "app/src/components/Layout/Sidebar/SidebarOpenNotes.jsx", "app/src/components/Notes/NoteTabBar.jsx", "app/src/components/Layout/ResizablePanes.jsx", "app/src/contexts/NoteTabsContext.jsx"],
    },
    Y: {
      name: "Contexts", kind: "state", count: "8",
      path: "app/src/contexts/", size: "8 files · 771 lines",
      gx: 7, gy: 0, w: 2, d: 2, h: 3, layers: 8,
      what: [
        ["p", "Eight contexts against the web build's five. Still deliberately thin — cross-cutting concerns only, never the data itself."],
        ["ul", [
          "<b>SettingsContext</b> — every preference (376 lines), persisted into <code>settings.siddran</code>",
          "<b>ApiContext</b> — <code>authFetch</code> for components too deep to prop-drill into",
          "<b>CalendarViewContext</b> — view, focused day, peek state, and the 2-column day toggles",
          "<b>NoteTabsContext</b> <span class='tag'>desktop</span> — which notes are open, and in what order",
          "<b>PdfViewContext</b> <span class='tag'>desktop</span> — the PDF side pane",
          "<b>SidebarContext</b> <span class='tag'>desktop</span> — collapse state, so any surface can offer a show button",
          "<b>SandboxViewContext</b> / <b>NoteSplitContext</b> — pane and split state",
        ]],
      ],
      add: [["p", "A user-facing preference: field + default in <code>SettingsContext.jsx</code>, control in <code>SettingsPopup.jsx</code>. It persists to the Bag automatically. Note the one-time localStorage migration pattern used when a default flips — copy it rather than silently changing behaviour for existing vaults."]],
      how: [["p", "<code>createContext</code> + provider + a <code>useX()</code> that throws outside its provider; values wrapped in <code>useMemo</code>. Some view state also mirrors into localStorage (device-local, deliberately not synced)."]],
      files: ["app/src/contexts/SettingsContext.jsx", "app/src/contexts/NoteTabsContext.jsx", "app/src/contexts/PdfViewContext.jsx", "app/src/contexts/CalendarViewContext.jsx", "app/src/contexts/SidebarContext.jsx"],
    },
    I: {
      name: "Splash screen", kind: "launch animation", count: "177", flag: "DESKTOP ONLY",
      path: "app/src/components/Splash/", size: "2 files · 177 lines",
      gx: 10, gy: 0, w: 2, d: 2, h: 1,
      what: [["p", "The launch sequence: a zippered amber bag drops in, the zipper slides open, the interior glows, the Siddran sparkle rises, and the camera dives into the bag to reveal the app. Roughly 3.6 seconds, once per app session, Esc-skippable, and it honours <code>prefers-reduced-motion</code>."]],
      add: [["p", "Timing constants are isolated in <code>splashTiming.js</code>. Keep it early-return in App.jsx so boot work runs underneath while it plays."]],
      how: [["p", "Pure CSS keyframes over an inline SVG — no animation library. A <code>sessionStorage</code> flag (<code>siddran_splash_shown</code>) makes it once-per-launch rather than once-per-mount."]],
      files: ["app/src/components/Splash/SplashScreen.jsx", "app/src/components/Splash/splashTiming.js"],
    },

    /* ── vault ─────────────────────────────────────────────── */
    W: {
      name: "Tauri shell (Rust)", kind: "native shell", count: "112", flag: "DESKTOP ONLY",
      path: "src-tauri/", size: "112 lines of Rust",
      gx: 13, gy: 0, w: 3, d: 2, h: 3,
      what: [
        ["p", "The desktop window and the only code with real OS access. Deliberately tiny — nine filesystem commands and a native folder dialog. All application logic stays in JavaScript."],
        ["ul", [
          "<code>bag_exists</code>, <code>bag_read_dir</code>, <code>bag_read_text</code>, <code>bag_write_text</code>",
          "<code>bag_mkdirp</code>, <code>bag_remove</code>, <code>bag_rename</code>",
          "<code>bag_write_bytes</code> / <code>bag_read_bytes</code> — base64 across the bridge, for image attachments",
        ]],
        ["p", "It uses <code>std::fs</code> directly rather than tauri-plugin-fs, because a Bag is a folder the user picks <i>anywhere</i> and the plugin's path scoping would refuse it."],
      ],

      <polygon class="joint" points="${pts([[j[0], j[1] - 3], [j[0] + 3.5, j[1]], [j[0], j[1] + 3], [j[0] - 3.5, j[1]]])}"/>`
  }

  function draw() {
    const list = placed()
    const byId = {}; list.forEach(b => byId[b.id] = b)
    // ground grid
    let maxX = 0, maxY = 0
    list.forEach(b => { maxX = Math.max(maxX, b.gx + b.w); maxY = Math.max(maxY, b.gy + b.d) })
    maxX += 2; maxY += 2
    let g = ''
    for (let x = -1; x <= maxX; x++) g += `<line class="grid" x1="${P(x, -1, 0)[0]}" y1="${P(x, -1, 0)[1]}" x2="${P(x, maxY, 0)[0]}" y2="${P(x, maxY, 0)[1]}"/>`
    for (let y = -1; y <= maxY; y++) g += `<line class="grid" x1="${P(-1, y, 0)[0]}" y1="${P(-1, y, 0)[1]}" x2="${P(maxX, y, 0)[0]}" y2="${P(maxX, y, 0)[1]}"/>`
    // painter's algorithm: back (small gx+gy) to front
    list.sort((a, b) => (a.gx + a.gy) - (b.gx + b.gy) || a.gy - b.gy)
    const wires = scene().edges.map(e => drawWire(e, byId)).join('')
    svg.innerHTML = `${DEFS}<g id="cam">${g}${wires}${list.map(drawBlock).join('')}</g>`
    svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`)
  }

  function fit() {
    const list = placed()
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9
    list.forEach(b => {
      ;[[b.gx, b.gy, b.h], [b.gx + b.w, b.gy, b.h], [b.gx + b.w, b.gy + b.d, 0], [b.gx, b.gy + b.d, 0], [b.gx, b.gy, 0], [b.gx + b.w, b.gy + b.d, b.h]]
        .forEach(([x, y, z]) => {
          const p = P(x, y, z)
          x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0])
          y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1])
        })
    })
    const pad = 90
    const r = svg.getBoundingClientRect()
    const w = (x1 - x0) + pad * 2, h = (y1 - y0) + pad * 2
    const ar = r.width / Math.max(r.height, 1)
    let vw = w, vh = h
    if (w / h > ar) vh = w / ar; else vw = h * ar
    vb = { x: x0 - pad - (vw - w) / 2, y: y0 - pad - (vh - h) / 2, w: vw, h: vh }
    draw()
  }

  /* ── content rendering ─────────────────────────────────────── */
  function blocks(arr) {
    if (!arr) return ''
    return arr.map(b => {
      if (typeof b === 'string') return `<p>${b}</p>`
      const [k, v] = b
      if (k === 'p') return `<p>${v}</p>`
      if (k === 'h') return `<h2>${v}</h2>`
      if (k === 'ul') return `<ul>${v.map(i => `<li>${i}</li>`).join('')}</ul>`
      if (k === 'flow') return `<div class="flow">${v}</div>`
      if (k === 'files') return `<ul class="files">${v.map(i => `<li><span class="f">${i}</span></li>`).join('')}</ul>`
      if (k === 'tags') return `<div>${v.map(i => `<span class="tag">${i}</span>`).join('')}</div>`
      return ''
    }).join('')
  }

  function paint() {
    const id = sel || hover
    if (!id) {
      const o = MAP.overview
      body.innerHTML = `<div class="kicker">${o.kicker}</div><h1>${o.title}</h1>
        <p class="sub">${o.sub}</p>${blocks(tab === 'what' ? o.what : o.how)}`
      body.scrollTop = 0
      return
    }
    const n = node(id)
    if (!n) return
    const s = scene()
    const links = s.edges.filter(e => e[0] === id || e[1] === id)
      .map(e => (e[0] === id ? '&#8594; ' : '&#8592; ') + (node(e[0] === id ? e[1] : e[0])?.name || ''))
    let html = `<div class="kicker">${id} &#183; ${n.kind || 'module'}${n.flag ? ' &#183; ' + n.flag : ''}</div>
      <h1>${n.name}</h1>
      <p class="sub">${n.path || ''}</p>
      <div class="meta">
        ${n.size ? `<div><span class="k">Size</span><br>${n.size}</div>` : ''}
        ${n.deps ? `<div><span class="k">Leans on</span><br>${n.deps}</div>` : ''}
      </div>`
    if (tab === 'what') {
      html += blocks(n.what)
      if (n.add) html += `<h2>Where new code goes</h2>${blocks(n.add)}`
      if (links.length) html += `<h2>Wired to</h2><ul>${links.map(l => `<li>${l}</li>`).join('')}</ul>`
    } else {
      html += blocks(n.how)
      if (n.files) html += `<h2>Key files</h2><ul class="files">${n.files.map(f => `<li><span class="f">${f}</span></li>`).join('')}</ul>`
    }
    if (n.inside && !stack.length) html += `<button class="link" data-go="${id}">&#8594; go inside ${n.name}</button>`
    if (stack.length) html += `<button class="link" data-out="1">&#8592; come back out</button>`
    body.innerHTML = html
    body.scrollTop = 0
  }

  /* ── left rail ─────────────────────────────────────────────── */
  function buildRail() {
    let h = ''
    if (stack.length) {
      const p = MAP.nodes[stack[0]]
      h += `<div class="grp">Inside &#183; ${p.name}</div>`
      for (const id in p.inside.nodes) {
        const n = p.inside.nodes[id]
        h += row(id, n, false)
      }
    } else {
      for (const g of MAP.groups) {
        h += `<div class="grp">${g.title}</div>`
        for (const id of g.ids) {
          const n = MAP.nodes[id]
          if (!n) continue
          h += row(id, n, false)
          if (n.inside) for (const cid in n.inside.nodes) h += row(cid, n.inside.nodes[cid], true, id)
        }
      }
    }
    rail.innerHTML = h
  }
  function row(id, n, child, parent) {
    const on = id === sel ? ' on' : ''
    return `<button class="row${child ? ' child' : ''}${on}" data-row="${id}"${parent ? ` data-parent="${parent}"` : ''}>
      <span class="rc">${id}</span><span class="rn">${n.name}</span><span class="rx">${shortFlag(n.flag) || n.count || ''}</span>
    </button>`
  }

  /* ── navigation ────────────────────────────────────────────── */
  function goInside(id) {
    if (!MAP.nodes[id] || !MAP.nodes[id].inside) return
    stack = [id]; sel = null; hover = null
    document.getElementById('b-back').disabled = false
    document.getElementById('crumb').textContent = MAP.nodes[id].name
    buildRail(); fit(); paint()
  }
  function goOut() {
    if (!stack.length) return
    sel = stack[0]; stack = []; hover = null
    document.getElementById('b-back').disabled = true
    document.getElementById('crumb').textContent = ''
    buildRail(); fit(); paint()
  }
  function select(id, parent) {
    if (parent && !stack.length) { goInside(parent); }
    sel = id; hover = null
    buildRail(); draw(); paint()
  }

  /* ── events ────────────────────────────────────────────────── */
  svg.addEventListener('pointerover', e => {
    const g = e.target.closest('.blk'); if (!g) return
    hover = g.dataset.id; draw(); paint()
  })
  svg.addEventListener('pointerout', e => {
    const g = e.target.closest('.blk'); if (!g) return
    if (hover === g.dataset.id) { hover = null; draw(); paint() }
  })
  svg.addEventListener('click', e => {
    const g = e.target.closest('.blk')
    if (!g) { sel = null; buildRail(); draw(); paint(); return }
    sel = g.dataset.id; buildRail(); draw(); paint()
  })
  svg.addEventListener('dblclick', e => {
    const g = e.target.closest('.blk'); if (!g) return
    goInside(g.dataset.id)
  })
  rail.addEventListener('click', e => {
    const b = e.target.closest('.row'); if (!b) return
    select(b.dataset.row, b.dataset.parent)
  })
  body.addEventListener('click', e => {
    const go = e.target.closest('[data-go]'); if (go) return goInside(go.dataset.go)
    const out = e.target.closest('[data-out]'); if (out) return goOut()
  })
  document.getElementById('tabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return
    tab = b.dataset.tab
    ;[...document.querySelectorAll('#tabs button')].forEach(x => x.classList.toggle('on', x === b))
    paint()
  })
  document.getElementById('b-fit').onclick = () => fit()
  document.getElementById('b-back').onclick = () => goOut()
  const zoom = (f, cx, cy) => {
    const r = svg.getBoundingClientRect()
    const px = cx === undefined ? .5 : (cx - r.left) / r.width
    const py = cy === undefined ? .5 : (cy - r.top) / r.height
    const nx = vb.x + vb.w * px, ny = vb.y + vb.h * py
    vb.w *= f; vb.h *= f
    vb.x = nx - vb.w * px; vb.y = ny - vb.h * py
    svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`)
  }
  document.getElementById('b-in').onclick = () => zoom(1 / 1.25)
  document.getElementById('b-out').onclick = () => zoom(1.25)
  svg.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY > 0 ? 1.12 : 1 / 1.12, e.clientX, e.clientY) }, { passive: false })

  let drag = null
  svg.addEventListener('pointerdown', e => {
    drag = { x: e.clientX, y: e.clientY, vx: vb.x, vy: vb.y }
    svg.classList.add('drag'); svg.setPointerCapture(e.pointerId)
  })
  svg.addEventListener('pointermove', e => {
    if (!drag) return
    const r = svg.getBoundingClientRect()
    vb.x = drag.vx - (e.clientX - drag.x) * (vb.w / r.width)
    vb.y = drag.vy - (e.clientY - drag.y) * (vb.h / r.height)
    svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`)
  })
  const endDrag = e => { if (drag) { drag = null; svg.classList.remove('drag'); try { svg.releasePointerCapture(e.pointerId) } catch (_) { } } }
  svg.addEventListener('pointerup', endDrag)
  svg.addEventListener('pointercancel', endDrag)
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (stack.length) goOut(); else { sel = null; buildRail(); draw(); paint() } }
    if (e.key === 'Enter' && sel) goInside(sel)
  })
  window.addEventListener('resize', () => fit())

  /* ── boot ──────────────────────────────────────────────────── */
  document.title = MAP.title
  document.getElementById('s-repo').textContent = MAP.repo
  document.getElementById('stats').innerHTML = MAP.stats
    .map(s => `<div class="stat"><span class="k">${s.k}</span><span class="v">${s.v}</span></div>`).join('')
  buildRail(); paint(); fit()
  // #E opens that block (and drills in if it has an inside) — handy for linking
  // straight to a subsystem from notes or a README.
  const h = decodeURIComponent((location.hash || '').slice(1))
  if (h && MAP.nodes[h]) {
    if (MAP.nodes[h].inside) goInside(h)
    else { sel = h; buildRail(); draw(); paint() }
  }
})()
</script>
</body>
</html>
